<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 34px; font-weight: 700; fill: #1f2937; text-anchor: middle; }
      .subtitle { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 18px; fill: #607085; text-anchor: middle; }
      .band { fill: #ffffff; stroke: #d8e1ec; stroke-width: 1.3; }
      .band-title { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 16px; font-weight: 700; fill: #536273; text-anchor: middle; }
      .node { stroke-width: 1.7; }
      .sys { fill: #e9f7ef; stroke: #2c8a62; }
      .sense { fill: #e8f5ff; stroke: #2d7fbd; }
      .motion { fill: #fff4dc; stroke: #bd7a16; }
      .arm { fill: #f1edff; stroke: #7357bf; }
      .end { fill: #fdeaea; stroke: #c44e4e; }
      .decision { fill: #ffffff; stroke: #566579; stroke-width: 1.7; }
      .text { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 18px; fill: #253142; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 14px; fill: #65758a; }
      .label { font-family: "Microsoft YaHei", "SimHei", sans-serif; font-size: 15px; fill: #526274; }
      .label-bg { fill: #f7f9fc; stroke: none; }
      .arrow { fill: none; stroke: #526274; stroke-width: 2.1; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #8795a8; stroke-width: 1.9; stroke-dasharray: 7 7; marker-end: url(#arrow-muted); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#526274"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8795a8"/>
    </marker>
  </defs>

  <rect class="bg" width="1100" height="820"/>
  <text class="title" x="550" y="48">机器人自动运行程序流程图</text>
  <text class="subtitle" x="550" y="78">扫码建图、路径执行、视觉修正、机械臂作业与返航的完整闭环</text>

  <rect class="band" x="70" y="118" width="960" height="92" rx="14"/>
  <text class="band-title" x="550" y="140">系统初始化</text>

  <rect class="band" x="70" y="245" width="960" height="112" rx="14"/>
  <text class="band-title" x="550" y="268">扫码建图</text>

  <rect class="band" x="70" y="395" width="960" height="140" rx="14"/>
  <text class="band-title" x="550" y="418">路径执行</text>

  <rect class="band" x="70" y="555" width="960" height="140" rx="14"/>
  <text class="band-title" x="550" y="578">作业闭环</text>

  <rect class="band" x="210" y="700" width="680" height="112" rx="14"/>

  <g id="top">
    <rect class="node sys" x="395" y="148" width="310" height="50" rx="25"/>
    <text class="text" x="550" y="166">上电初始化并创建任务</text>
    <text class="text small" x="550" y="187">硬件 / FreeRTOS / 底盘 / IMU / 机械臂 / 显示</text>
  </g>

  <g id="scan">
    <rect class="node motion" x="105" y="287" width="250" height="58" rx="12"/>
    <text class="text" x="230" y="307">移动到二维码位置</text>
    <text class="text small" x="230" y="329">从启停区出发</text>

    <rect class="node sense" x="425" y="287" width="250" height="58" rx="12"/>
    <text class="text" x="550" y="307">读取任务码</text>
    <text class="text small" x="550" y="329">二维码识别并解析顺序</text>

    <rect class="node sense" x="745" y="287" width="250" height="58" rx="12"/>
    <text class="text" x="870" y="307">建立物料映射</text>
    <text class="text small" x="870" y="329">串口屏显示任务信息</text>
  </g>

  <g id="path">
    <rect class="node motion" x="105" y="440" width="250" height="62" rx="12"/>
    <text class="text" x="230" y="462">执行标定路径段</text>
    <text class="text small" x="230" y="487">直线 / 横移 / 航向保持</text>

    <rect class="node motion" x="425" y="440" width="250" height="62" rx="12"/>
    <text class="text" x="550" y="462">转向或连续过弯</text>
    <text class="text small" x="550" y="487">原地转向 / 漂移过弯</text>

    <polygon class="decision" points="870,420 990,471 870,522 750,471"/>
    <text class="text" x="870" y="464">到达作业点？</text>
    <text class="text small" x="870" y="489">扫码 / 取料 / 放料</text>
  </g>

  <g id="work">
    <rect class="node sense" x="745" y="595" width="250" height="62" rx="12"/>
    <text class="text" x="870" y="617">关键点确认</text>
    <text class="text small" x="870" y="642">二维码或视觉定位修正</text>

    <rect class="node arm" x="425" y="595" width="250" height="62" rx="12"/>
    <text class="text" x="550" y="617">机械臂取放物料</text>
    <text class="text small" x="550" y="642">伸出 / 升降 / 夹取 / 回收</text>

    <polygon class="decision" points="230,575 350,626 230,677 110,626"/>
    <text class="text" x="230" y="619">当前轮次完成？</text>
    <text class="text small" x="230" y="644">第一轮 / 第二轮</text>
  </g>

  <g id="finish">
    <polygon class="decision" points="390,715 495,760 390,805 285,760"/>
    <text class="text" x="390" y="753">全部任务完成？</text>
    <text class="text small" x="390" y="777">取放料与圆盘机作业</text>

    <rect class="node end" x="610" y="730" width="260" height="60" rx="30"/>
    <text class="text" x="740" y="752">返回启停区并结束</text>
    <text class="text small" x="740" y="775">停止底盘运动输出</text>
  </g>

  <g id="arrows">
    <path class="arrow" d="M550 198 C550 228 230 228 230 287"/>
    <path class="arrow" d="M355 316 L425 316"/>
    <path class="arrow" d="M675 316 L745 316"/>
    <path class="arrow" d="M870 345 C870 382 230 382 230 440"/>

    <path class="arrow" d="M355 471 L425 471"/>
    <path class="arrow" d="M675 471 L750 471"/>

    <path class="arrow" d="M870 522 L870 595"/>
    <text class="label" x="888" y="560">是</text>
    <path class="arrow" d="M745 626 L675 626"/>
    <path class="arrow" d="M425 626 L350 626"/>
    <path class="arrow" d="M230 677 C230 718 282 727 324 744"/>

    <path class="arrow" d="M495 760 L610 760"/>
    <text class="label" x="532" y="747">是</text>

    <path class="loop" d="M750 471 C705 525 395 528 355 490"/>
    <rect class="label-bg" x="598" y="518" width="132" height="24" rx="6"/>
    <text class="label" x="610" y="536">否：继续路径段</text>

    <path class="loop" d="M110 626 C45 626 45 471 105 471"/>
    <rect class="label-bg" x="74" y="534" width="124" height="24" rx="6"/>
    <text class="label" x="86" y="552">否：继续本轮</text>

    <path class="loop" d="M390 715 C352 692 292 684 252 660"/>
    <rect class="label-bg" x="342" y="674" width="154" height="24" rx="6"/>
    <text class="label" x="355" y="690">否：下一轮或圆盘机</text>
  </g>
</svg>
